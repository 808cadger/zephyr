name: Build Zephyr APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] || { echo "APK not found"; exit 1; }
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "APK built: $SIZE ✓"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "Zephyr ${{ github.ref_name }}"
          body: |
            ## Zephyr ${{ github.ref_name }}

            The free app store — install, share, discover every app instantly.

            ### Install
            - **PWA (recommended):** https://cadger808.codeberg.page/zephyr
            - **APK (Android):** Download `app-debug.apk` below

            ### What's new
            See commit history for changes.

            No app store. No fees. No data shared.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
